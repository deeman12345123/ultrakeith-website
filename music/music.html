<body>
<header id="kk-header" class="kk-header"></header>
<main id="main">
<div class="page-head">
  <div class="wrap">
    <h1 class="display">Music</h1>
    <p class="lede">79 releases, from Ultramagnetic's Critical Beatdown in 1988 to No Alias in 2026. Albums, EPs, mixtapes and group records. Singles and guest spots aren't listed.</p>
  </div>
</div>

<section class="section section--tight" aria-label="All releases">
  <div class="wrap">
    <form class="filters" role="search" onsubmit="return false">
      <div class="chips" role="group" aria-label="Show">
        <button type="button" class="chip" data-show="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-show="solo" aria-pressed="false">Kool Keith albums</button>
        <button type="button" class="chip" data-show="collab" aria-pressed="false">With others</button>
        <button type="button" class="chip" data-show="short" aria-pressed="false">EPs, mixtapes, compilations</button>
        <button type="button" class="chip" data-show="listen" aria-pressed="false">Streaming now</button>
      </div>
      <label class="sr-only" for="q">Search releases</label>
      <input class="field" type="search" id="q" placeholder="Search title, artist or year" autocomplete="off">
      <label class="sr-only" for="sort">Sort</label>
      <select class="field" id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">A to Z</option>
      </select>
    </form>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="albums albums--5" id="albums"></div>
    <noscript><p>Turn on JavaScript to see the album list.</p></noscript>
  </div>
</section>
</main>
<footer id="kk-footer" class="kk-footer"></footer>
<script src="/assets/site.js"></script>
<script src="/assets/data/albums.js"></script>
<script src="/assets/data/eras.js"></script>
<script src="/assets/music.js"></script>
</body>
