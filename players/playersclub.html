<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

<link rel="stylesheet" href="/assets/site.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* FULLSCREEN BACKGROUND THAT SCROLLS */
        .main {
            position: relative;
            width: 100%;
            overflow: hidden;
            background-image: url('entrtyby.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* ENTRANCE SCENE: tall enough that the door never runs into the footer */
        .entrance-scene {
            position: relative;
            width: 100%;
            height: max(calc(100vh - var(--header-h)), 800px);
            background: transparent;
        }
        
        /* TITLE */
        .club-title {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: #FF1493;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
            text-transform: lowercase;
            font-style: italic;
            white-space: nowrap;
            margin: 0;
            line-height: 1.2;
            z-index: 10;
        }
        
        /* DOOR - MADE MUCH BIGGER WITH VERY DARK BROWN COLOR */
        .door {
            position: absolute;
            top: 67%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; /* Increased from 160px */
            height: 520px; /* Made a bit taller */
            background: 
                linear-gradient(90deg, transparent 0%, rgba(18, 14, 5, 0.4) 25%, transparent 50%, rgba(18, 14, 5, 0.4) 75%, transparent 100%),
                linear-gradient(0deg, #120e05 0%, #1a1408 15%, #22190a 30%, #120e05 45%, #161107 60%, #1e160c 75%, #0f0b04 100%);
            border: 1px solid #DAB547; /* Made even thinner */
            border-radius: 20px; /* Slightly larger radius */
            cursor: pointer;
            z-index: 20;
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.95),
                inset 0 0 30px rgba(0, 0, 0, 0.7); /* Very dark shadow */
            transition: transform 1s ease-in-out;
            position: relative;
        }
        
        /* Very dark brown wood grain texture overlay */
        .door::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 8px,
                    rgba(26, 20, 8, 0.3) 10px,
                    rgba(26, 20, 8, 0.3) 12px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 40px,
                    rgba(15, 11, 4, 0.4) 42px,
                    rgba(15, 11, 4, 0.4) 44px
                );
            border-radius: 19px;
            pointer-events: none;
        }
        
        /* DOOR HANDLE ONLY - WINDOW REMOVED */
        
        .door-handle {
            position: absolute;
            right: 20px; /* More space from edge */
            top: 50%;
            transform: translateY(-50%);
            width: 20px; /* Bigger handle */
            height: 60px; /* Bigger handle */
            background: linear-gradient(90deg, #DAB547, #FFD700, #DAB547);
            border-radius: 12px; /* Larger radius */
            z-index: 1;
            box-shadow: 2px 0 8px rgba(218, 181, 71, 0.3);
        }
        
        /* PIN BOX - ADJUSTED POSITION AND MADE BIGGER */
        .pin-box {
            position: absolute;
            top: 67%;
            left: calc(50% + 180px); /* Adjusted for bigger door */
            transform: translateY(-50%);
            width: 100px; /* Increased from 80px */
            height: 140px; /* Increased from 110px */
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 1px solid #DAB547; /* Made even thinner */
            border-radius: 15px; /* Larger radius */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #DAB547;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); /* Bigger shadow */
        }
        
        .pin-icon {
            font-size: 2.5rem; /* Bigger icon */
            margin-bottom: 8px;
        }
        
        .pin-text {
            font-size: 0.8rem; /* Slightly bigger text */
            letter-spacing: 2px;
        }
        
        /* SCENES */
        .scene {
            display: none;
        }
        
        .scene.active {
            display: block;
        }
        
        /* PIN OVERLAY */
        .pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .pin-pad {
            background: rgba(26, 26, 26, 0.95);
            border: 3px solid #DAB547;
            border-radius: 20px;
            padding: 30px;
            width: 300px;
            position: relative;
        }
        
        .pin-close {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: #DAB547;
            color: #000;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        
        .pin-display {
            width: 100%;
            height: 60px;
            background: #000;
            border: 2px solid #DAB547;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            color: #DAB547;
        }
        
        .pin-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .pin-btn {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid #DAB547;
            border-radius: 10px;
            color: #DAB547;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .pin-btn:hover {
            background: #DAB547;
            color: #000;
        }

        /* RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            .entrance-scene {
                height: max(calc(100vh - var(--header-h)), 540px);
            }

            .door {
                width: 220px;
                height: 340px;
            }
            
            .pin-box {
                left: calc(50% + 140px);
                width: 80px;
                height: 120px;
            }
            
            .pin-icon {
                font-size: 2rem;
            }
            
            .club-title {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .entrance-scene {
                height: max(calc(100vh - var(--header-h)), 460px);
            }

            .door {
                width: 180px;
                height: 280px;
            }
            
            .pin-box {
                left: calc(50% + 110px);
                width: 70px;
                height: 100px;
            }
            
            .pin-icon {
                font-size: 1.8rem;
            }
            
            .pin-text {
                font-size: 0.7rem;
            }
            
            .club-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<header id="kk-header" class="kk-header"></header>
    <main class="main" id="main">
        <div class="scene entrance-scene active" id="entranceScene">
            <h1 class="club-title">the players club</h1>
            
            <div class="door" id="clubDoor">
                <div class="door-handle"></div>
            </div>
            
            <div class="pin-box" onclick="showPinPad()" role="button" tabindex="0" aria-label="Open the keypad" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showPinPad();}">
                <div class="pin-icon">🔢</div>
                <div class="pin-text">PIN</div>
            </div>
        </div>
    </main>
    
    <div class="pin-overlay" id="pinOverlay">
        <div class="pin-pad">
            <button class="pin-close" onclick="hidePinPad()" aria-label="Close the keypad">×</button>
            <div class="pin-display" id="pinDisplay">***</div>
            <div class="pin-buttons">
                <button class="pin-btn" onclick="enterPin('1')">1</button>
                <button class="pin-btn" onclick="enterPin('2')">2</button>
                <button class="pin-btn" onclick="enterPin('3')">3</button>
                <button class="pin-btn" onclick="enterPin('4')">4</button>
                <button class="pin-btn" onclick="enterPin('5')">5</button>
                <button class="pin-btn" onclick="enterPin('6')">6</button>
                <button class="pin-btn" onclick="enterPin('7')">7</button>
                <button class="pin-btn" onclick="enterPin('8')">8</button>
                <button class="pin-btn" onclick="enterPin('9')">9</button>
                <button class="pin-btn" onclick="clearPin()">C</button>
                <button class="pin-btn" onclick="enterPin('0')">0</button>
                <button class="pin-btn" onclick="submitPin()">✓</button>
            </div>
        </div>
    </div>

    <script>
        let currentPin = '';
        let pinAttempts = 0;

        function showPinPad() {
            document.getElementById('pinOverlay').style.display = 'flex';
            updatePinDisplay();
        }

        function hidePinPad() {
            document.getElementById('pinOverlay').style.display = 'none';
        }

        function enterPin(digit) {
            if (currentPin.length < 3) {
                currentPin += digit;
                updatePinDisplay();
            }
        }

        function clearPin() {
            currentPin = '';
            updatePinDisplay();
        }

        function updatePinDisplay() {
            const display = document.getElementById('pinDisplay');
            if (display) {
                if (currentPin.length === 0) {
                    display.textContent = '***';
                } else {
                    display.textContent = currentPin + '*'.repeat(3 - currentPin.length);
                }
            }
        }

        function submitPin() {
            if (currentPin.length !== 3) {
                alert('Enter 3 digits!');
                return;
            }
            
            pinAttempts++;
            
            if (currentPin === '223') {
                hidePinPad();
                alert('Welcome to The Players Club!');
                
                setTimeout(() => {
                    const door = document.getElementById('clubDoor');
                    if (door) {
                        door.style.transform = 'translate(-150%, -50%) rotateY(-90deg)';
                        door.style.opacity = '0';
                    }
                }, 1000);
            } else {
                let message = '';
                if (pinAttempts === 1) {
                    message = 'Come on, player... you should know this one.';
                } else if (pinAttempts === 2) {
                    message = 'Keith\'s not gonna like this... think harder, kid.';
                } else if (pinAttempts === 3) {
                    message = 'Alright, here\'s your hint: Dr. Dooom\'s apartment number';
                } else {
                    message = 'Too many attempts! The answer is 223 - Dr. Dooom\'s apartment!';
                }
                alert(message);
            }
            
            clearPin();
        }

        updatePinDisplay();
    </script>
<footer id="kk-footer" class="kk-footer"></footer>
<script src="/assets/site.js"></script>
</body>
</html>
